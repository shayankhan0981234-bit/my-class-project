    <style>
           :root {
            --Yellow: rgb(255, 208, 0);
            --gray: rgb(77, 77, 77);
            --green: rgb(33, 160, 8);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to right, rgb(65, 63, 63), rgb(192, 189, 189));
            /* display: flex;
             justify-content: center;
            align-items: center; */

            /* margin: 0;
            overflow: hidden;
            transition: background-color 0.5s; */
        }
        header .btn {
            display: inline-block;
            margin-top: 1rem;
            background: var(--Yellow);
            color: rgb(77, 77, 77);
            padding: .1rem 2rem;
            border: .3rem solid var(--Yellow);
            cursor: pointer;
            font-size: 1.4rem;
            border-radius: 5rem;
            text-decoration: none;
        }


        header .btn:hover {
            color: var(--Yellow);
            background: var(--gray);
            font-weight: bold;
            border: .3rem solid var(--Yellow);
            color: var(--Yellow);
        }
        section {
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .container {
            margin-top: 8%;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 800px;
            text-align: center;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.9);
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: rgb(77, 77, 77);
        }

        .search-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
        }

        input {
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid rgb(77, 77, 77);
            border-radius: 25px;
            width: calc(100% - 140px);
            margin-right: 10px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
            z-index: 1;
        }

        input:focus {
            border-color: rgb(255, 208, 0);
            box-shadow: 0 0 10px rgb(230, 207, 109);
            outline: none;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, var(--Yellow), var(--Yellow));
            color: rgb(77, 77, 77);
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
            z-index: 1;
        }

        button:hover {
            background: linear-gradient(45deg, rgb(114, 113, 113), rgb(77, 77, 77));
            color: white;
            transform: scale(1.05);
        }

        /* New */

        #animalInfo {
            margin-top: 20px;
            /* display: flex; */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        #animalImage {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        /* End */
        #animalInfo {
            margin-top: 20px;
            /* display: flex; */
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
        }

        #animalImage {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        #animalInfo img {
            flex-shrink: 0;
        }

        #animalDescription,
        #animalHabitat,
        #animalDiet,
        #animalLifespan {
            margin: 10px 0;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            #animalInfo {
                flex-direction: column;
                text-align: center;
            }

            #animalImage {
                margin-bottom: 20px;
            }
        }
    </style>
</head>

        function getAnimalInfo() {
            const animalName = document.getElementById('animalInput').value.toLowerCase();
            const infoDiv = document.getElementById('animalInfo');
            const imageElement = document.getElementById('animalImage');
            const descriptionElement = document.getElementById('animalDescription');
            const habitatElement = document.getElementById('animalHabitat');
            const dietElement = document.getElementById('animalDiet');
            const lifespanElement = document.getElementById('animalLifespan');

            if (animalData[animalName]) {
                const animal = animalData[animalName];
                imageElement.src = animal.image;
                imageElement.style.display = 'block';
                descriptionElement.textContent = `Description: ${animal.description}`;
                habitatElement.textContent = `Habitat: ${animal.habitat}`;
                dietElement.textContent = `Diet: ${animal.diet}`;
                lifespanElement.textContent = `Lifespan: ${animal.lifespan}`;
            } else {
                imageElement.style.display = 'none';
                descriptionElement.textContent = '';
                habitatElement.textContent = '';
                dietElement.textContent = '';
                lifespanElement.textContent = 'Animal not found. Please try another name.';
            }
        }
